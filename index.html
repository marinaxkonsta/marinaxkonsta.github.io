<!DOCTYPE html>
<html>
<head>
    <!-- External QA page -->
</head>
<body>
  <script>
    (function(d,t) {
      var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
      g.src="https://trc.dfd.com//embed.js"
      g.type="module";
      s.parentNode.insertBefore(g,s);
      g.onload=function(){
          window.virtualCareMessenger = new window.VirtualCareMessengerEncrypted({
            domain: '<%= Chaskiq::Config.get('HOST') %>',
            ws:  '<%= Chaskiq::Config.get('WS') %>',
            app_id: "<%= @app.key %>"
          })
        }
    })(document,"script");
  </script>
</body>
</html>
